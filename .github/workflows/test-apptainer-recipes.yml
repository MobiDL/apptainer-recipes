name: Test Apptainer Recipes

on:
  push:
    paths:
      - '**.def'
    branches:
      - dev  # Se déclenche uniquement sur les pushes vers la branche `dev`
  pull_request:
    paths:
      - '**.def'
    branches:
      - dev  # Se déclenche uniquement sur les PR vers la branche `dev`
  workflow_dispatch:  # Permet de lancer manuellement depuis l'UI GitHub

jobs:
  test-recipes:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev  # Explicite : utilise la branche `dev`

      - name: Install Apptainer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apptainer jq

      - name: Get list of changed .def files
        id: changed-files
        run: |
          # Si déclenché manuellement (workflow_dispatch), teste TOUS les .def
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES=$(find . -name "*.def" -type f | tr '\n' ' ')
          else
            # Sinon, teste uniquement les fichiers modifiés
            FILES=$(git diff --name-only --diff-filter=ACM ${{ github.event.before }} ${{ github.sha }} | grep '\.def$' | tr '\n' ' ')
          fi
          echo "Files to test: $FILES"
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Build and test each recipe
        run: |
          echo "# Test Results for Apptainer Recipes" > test_results.md
          echo "Date: $(date)" >> test_results.md
          echo "Branch: ${{ github.ref_name }}" >> test_results.md
          echo "" >> test_results.md

          for file in ${{ steps.changed-files.outputs.files }}; do
            echo "Processing $file..."
            tool_name=$(basename "$file" .def)
            container_name="${tool_name}.sif"

            echo "## $tool_name ($file)" >> test_results.md
            echo "" >> test_results.md

            # Construction
            echo "- Building container..." >> test_results.md
            if apptainer build --fakeroot "$container_name" "$file" 2>> test_results.md; then
              echo "  ✅ **Build succeeded**" >> test_results.md
            else
              echo "  ❌ **Build failed**" >> test_results.md
              rm -f "$container_name"
              continue
            fi

            # Test de commande
            echo "- Testing command..." >> test_results.md
            if apptainer run "$container_name" "$tool_name" --version >> test_results.md 2>&1; then
              echo "  ✅ **Command `${tool_name} --version` succeeded**" >> test_results.md
            elif apptainer run "$container_name" "$tool_name" -v >> test_results.md 2>&1; then
              echo "  ✅ **Command `${tool_name} -v` succeeded**" >> test_results.md
            elif apptainer run "$container_name" "$tool_name" --help >> test_results.md 2>&1 | head -n 1; then
              echo "  ✅ **Command `${tool_name} --help` succeeded**" >> test_results.md
            else
              echo "  ❌ **No version command found for `${tool_name}`**" >> test_results.md
            fi

            rm -f "$container_name"
            echo "" >> test_results.md
          done

          cat test_results.md

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apptainer-test-results
          path: test_results.md
